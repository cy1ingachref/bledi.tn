<div id="map"></div>

<div class="panel">
  <h1>Bledi.tn</h1>
  <div class="sub">Transports publics en Tunisie — Bus · Métro · Train · RFR</div>

  <label>1. Choisir le départ et l'arrivée</label>
  <div class="row">
    <button id="btnStart" class="outline" title="Cliquer sur la carte">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      Repère le départ
    </button>
    <button id="btnEnd" class="outline" title="Cliquer sur la carte">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      Repère l'arrivée
    </button>
  </div>
  <div class="row" style="margin-top:6px">
    <input type="text" id="qStart" placeholder="Ex: Tunis, Centre Ville" style="flex:1" autocomplete="off">
    <input type="text" id="qEnd" placeholder="Ex: Ariana, Centre" style="flex:1" autocomplete="off">
    <button id="btnSearch" class="outline" title="Recherche Nominatim (Tunisie)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Rechercher
    </button>
  </div>
  <div class="row" style="margin-top:6px">
    <input type="text" id="depTime" value="" placeholder="HH:MM (départ)" style="flex:1" autocomplete="off">
    <button id="btnNow" class="outline" title="Heure actuelle">Maintenant</button>
  </div>
  <div class="row" style="margin-top:4px">
    <input type="text" id="startLat" disabled style="flex:1;font-size:11px">
    <input type="text" id="startLng" disabled style="flex:1;font-size:11px">
    <input type="text" id="endLat" disabled style="flex:1;font-size:11px">
    <input type="text" id="endLng" disabled style="flex:1;font-size:11px">
  </div>

  <label>2. Villes rapides (27 principales)</label>
  <div class="row">
    <select id="quickStart" style="flex:1"><option value="">— Départ rapide —</option></select>
    <select id="quickEnd" style="flex:1"><option value="">— Arrivée rapide —</option></select>
  </div>

  <label>3. Calculer l'itinéraire</label>
  <button id="btnGo" class="primary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m21 21-4.3-4.3M12 8v8M8 12h8"/></svg>
    Calculer l'itinéraire
  </button>
  <div class="row" style="margin-top:6px">
    <button id="btnSwap" class="outline" title="Inverser départ et arrivée">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4"/><path d="M3 12h18"/></svg>
      Échanger
    </button>
    <button id="btnGeo" class="outline" title="Utiliser ma position GPS">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      Ma position
    </button>
    <button id="btnClear" class="danger">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Effacer
    </button>
  </div>

  <label>4. Affichage</label>
  <div class="row">
    <input type="checkbox" id="chkStations" checked style="width:18px;height:18px;accent-color:#58a6ff">
    <label for="chkStations" style="margin:0;font-size:12px;text-transform:none;letter-spacing:0;color:#c9d1d9">Afficher les <b>1 711</b> stations</label>
  </div>

  <div class="stats" id="stats">
    <div class="stat-row"><span>Données</span><span><b>232</b> lignes · <b>1 711</b> gares</span></div>
    <div class="stat-row"><span>Couverture GPS</span><span><b>100%</b> des gares</span></div>
    <div class="stat-row"><span>Départs programmés</span><span><b>228</b> lignes avec horaires</span></div>
  </div>

  <div class="result" id="result">
    <div class="opt" style="color:#8b949e;text-align:center;padding:24px 12px;font-size:13px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 8px;opacity:0.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      Sélectionnez un départ et une arrivée<br>pour calculer les itinéraires
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function timeMin(distKm, speedKmh) { return distKm / speedKmh * 60; }

function lineSpeed(mode) {
  return [22, 60, 40, 60, 50][mode] || 22; // bus, train, metro, rail, rfr
}

function nextDeparture(depsMin, arrivalMin) {
  for (let i = 0; i < depsMin.length; i++) {
    if (depsMin[i] >= arrivalMin) return depsMin[i] - arrivalMin;
  }
  if (depsMin.length > 0) return (1440 - arrivalMin) + depsMin[0]; // next day
  return null;
}

function formatTime(min) {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h + "h" + (m < 10 ? "0" : "") + m;
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + " m";
  return (m / 1000).toFixed(1) + " km";
}

// -- Dijkstra multi-modal router ----------------------------------------
function planRoutes(startLat, startLon, endLat, endLon, depMin) {
  var results = [];

  // Find nearest station to start and end
  var bestStart = -1, bestStartD = Infinity;
  var bestEnd = -1, bestEndD = Infinity;
  for (var i = 0; i < ST.length; i++) {
    var ds = haversineKm(startLat, startLon, ST[i]._lat, ST[i]._lon);
    if (ds < bestStartD) { bestStartD = ds; bestStart = i; }
    var de = haversineKm(endLat, endLon, ST[i]._lat, ST[i]._lon);
    if (de < bestEndD) { bestEndD = de; bestEnd = i; }
  }

  if (bestStart < 0 || bestEnd < 0) return results;
  if (bestStartD > 5 || bestEndD > 5) return results;

  var walkToStart = timeMin(bestStartD, 4.5);
  var walkToEnd = timeMin(bestEndD, 4.5);

  // Direct walk option
  var directKm = haversineKm(startLat, startLon, endLat, endLon);
  if (directKm <= 5) {
    results.push({
      totalMin: timeMin(directKm, 4.5),
      segs: [{t:"walk", from:"D\u00E9part", to:"Arriv\u00E9e", mins: timeMin(directKm, 4.5), dist: directKm*1000, label: "Marche directe"}],
      xfers: 0, mode: "walk", startSt: -1, endSt: -1
    });
  }

  // Taxi option
  results.push({
    totalMin: timeMin(directKm, 45),
    segs: [{t:"taxi", from:"D\u00E9part", to:"Arriv\u00E9e", mins: timeMin(directKm, 45), dist: directKm*1000, label: "Taxi / voiture"}],
    xfers: 0, mode: "taxi", startSt: -1, endSt: -1
  });

  // -- Dijkstra on stations --------------------------------------------
  var INF = 1e9;
  var bestT = new Array(ST.length).fill(INF);
  var bestLine = new Array(ST.length).fill(-1);   // -1=walked, >=0=line index
  var bestParent = new Array(ST.length).fill(null);
  var bestXfer = new Array(ST.length).fill(0);
  var bestArrival = new Array(ST.length).fill(0);

  var pq = [{si: bestStart, t: depMin + walkToStart, ln: -1, xf: 0, viaWalk: true}];
  bestT[bestStart] = depMin + walkToStart;
  bestArrival[bestStart] = depMin + walkToStart;

  var iter = 0;
  var MAX_ITER = 80000;

  while (pq.length > 0 && iter < MAX_ITER) {
    iter++;
    pq.sort(function(a,b){return a.t-b.t;});
    var cur = pq.shift();

    if (cur.t > bestT[cur.si] + 0.01) continue;
    if (cur.t > depMin + 240) continue; // 4h cutoff

    if (cur.si === bestEnd) {
      var totalMin = cur.t - depMin + walkToEnd;
      var segs = reconstructPath(bestParent, bestLine, bestXfer, bestStart, bestEnd, cur.si, walkToStart, walkToEnd, depMin);
      results.push({totalMin: totalMin, segs: segs, xfers: bestXfer[bestEnd], mode: "transit", startSt: bestStart, endSt: bestEnd});
      continue;
    }

    var sIdx = cur.si, t = cur.t, ln = cur.ln, xf = cur.xf;

    // 1. Walk to nearby stations (within 1.5km)
    for (var j = 0; j < ST.length; j++) {
      if (j === sIdx) continue;
      var d = haversineKm(ST[sIdx]._lat, ST[sIdx]._lon, ST[j]._lat, ST[j]._lon);
      if (d > 1.5) continue;
      var wt = timeMin(d, 4.5);
      var nt = t + wt;
      if (nt < bestT[j] - 0.01) {
        bestT[j] = nt;
        bestLine[j] = -1;
        bestXfer[j] = (ln !== -1) ? xf + 1 : xf;
        bestParent[j] = {from: sIdx, type: "walk", to: j, dist: d, mins: wt};
        pq.push({si: j, t: nt, ln: -1, xf: bestXfer[j], viaWalk: true});
      }
    }

    // 2. Continue on same line (if currently riding)
    if (ln !== -1) {
      var L = LINES[ln];
      var pos = L._stops.indexOf(sIdx);
      if (pos >= 0 && pos < L._nStops - 1) {
        var nextIdx = L._stops[pos + 1];
        var segD = haversineKm(ST[sIdx]._lat, ST[sIdx]._lon, ST[nextIdx]._lat, ST[nextIdx]._lon);
        var rt = timeMin(segD, lineSpeed(L._mode));
        var nt = t + rt;
        if (nt < bestT[nextIdx] - 0.01) {
          bestT[nextIdx] = nt;
          bestLine[nextIdx] = ln;
          bestXfer[nextIdx] = xf;
          bestParent[nextIdx] = {from: sIdx, type: "ride", ln: ln, to: nextIdx, segD: segD, rt: rt, continuing: true};
          pq.push({si: nextIdx, t: nt, ln: ln, xf: xf, viaWalk: false});
        }
      }
    }

    // 3. Board any line serving this station (different from current)
    var served = ST_LINES[sIdx];
    for (var li = 0; li < served.length; li++) {
      var lIdx = served[li];
      if (lIdx === ln) continue;
      var line = LINES[lIdx];
      var wait = nextDeparture(line._depsMin, t);
      if (wait === null) continue;

      var pos2 = line.stops.indexOf(sIdx);
      if (pos2 < 0) continue;

      var cumD = 0;
      for (var k = pos2; k < line._nStops; k++) {
        var nIdx = line.stops[k];
        var rt = 0;
        if (k > pos2) {
          var prev = line.stops[k-1];
          cumD += haversineKm(ST[prev]._lat, ST[prev]._lon, ST[nIdx]._lat, ST[nIdx]._lon);
          rt = timeMin(cumD, lineSpeed(line._mode));
        }
        var nt = t + wait + rt;
        if (nt < bestT[nIdx] - 0.01) {
          bestT[nIdx] = nt;
          bestLine[nIdx] = lIdx;
          bestXfer[nIdx] = xf;
          bestParent[nIdx] = {
            from: sIdx, type: "ride", ln: lIdx, to: nIdx,
            wait: wait, rt: rt, cumD: cumD, nStops: k - pos2, continuing: false,
            departMin: t + wait
          };
          pq.push({si: nIdx, t: nt, ln: lIdx, xf: xf, viaWalk: false});
        }
      }
    }
  }

  // Sort by total time
  results.sort(function(a,b){return a.totalMin - b.totalMin;});
  return results.slice(0, 5);
}

function reconstructPath(parent, lineUsed, xferCount, startSi, endSi, endSi2, walkToStart, walkToEnd, depMin) {
  var segs = [];
  var cur = endSi2;
  var path = [];

  while (cur !== startSi && parent[cur]) {
    path.push(parent[cur]);
    cur = parent[cur].from;
  }
  path.reverse();

  // Walk to first station
  if (path.length > 0 && path[0].type === "walk" && path[0].from === startSi) {
    // already included
  } else {
    // Add walk from start to first station in path
  }

  var prevType = null;
  for (var i = 0; i < path.length; i++) {
    var p = path[i];
    if (p.type === "walk") {
      var fromName = (p.from === startSi && i === 0) ? "D\u00E9part" : ST[p.from]._name;
      var toName = (p.to === endSi2 && i === path.length - 1) ? "Arriv\u00E9e" : ST[p.to]._name;
      segs.push({t:"walk", from:fromName, to:toName, mins:p.mins, dist:p.dist*1000, label:"Marche"});
      prevType = "walk";
    } else if (p.type === "ride") {
      var lnObj = LINES[p.ln];
      var fromName = (p.from === startSi && i === 0 && !path[i-1]) ? "D\u00E9part" : ST[p.from]._name;
      var toName = (p.to === endSi2 && i === path.length - 1) ? "Arriv\u00E9e" : ST[p.to]._name;
      var lnNum = lnObj._num || ("Ligne " + (p.ln+1));
      var mdName = MODE_NAMES[lnObj._mode] || "Transport";

      if (prevType === "ride" && i > 0 && path[i-1].type === "ride" && path[i-1].ln !== p.ln) {
        var prevLn = LINES[path[i-1].ln];
        var prevLnNum = prevLn._num || ("Ligne " + (path[i-1].ln+1));
        segs.push({t:"transfer", from: prevLnNum, to: lnNum,
          mins: 3, dist:0, label:"Correspondance " + prevLnNum + " -> " + lnNum});
      }

      if (p.continuing) {
        // Continuing on same line \u2014 one hop
        segs.push({t:"ride", from:fromName, to:toName, mins:p.rt, dist:p.segD*1000,
          label: mdName + " " + lnNum + " (suite)", line: lnNum, mode: mdName,
          line: lnObj, fromIdx: p.from, toIdx: p.to, fare: fareFor(lnObj),
          stops: p.to - p.from + 1, km: p.segD});
      } else {
        // Boarding a line
        if (prevType !== "wait") {
          var depTime = p.departMin !== undefined ? p.departMin : 0;
          var waitLabel = "Attente: prochain d\u00E9part " + formatTime(depTime % 1440);
          segs.push({t:"wait", from:fromName, to:toName, mins:p.wait, dist:0,
            label:waitLabel, line: lnNum, mode: mdName});
        }
        var rideLabel = mdName + " " + lnNum + (p.nStops > 0 ? " (" + p.nStops + " arr\u00EAt" + (p.nStops>1?"s":"") + ")" : "");
        segs.push({t:"ride", from:fromName, to:toName, mins:p.rt, dist:p.cumD*1000,
          label:rideLabel, line: lnNum, mode: mdName,
          line: lnObj, fromIdx: p.from, toIdx: p.to, fare: fareFor(lnObj),
          stops: p.nStops > 0 ? p.nStops + 1 : (p.to - p.from + 1), km: p.cumD});
      }
      prevType = "ride";
    }
  }

  // Walk from last station to end
  if (walkToEnd > 0.5) {
    var lastFrom = segs.length > 0 ? segs[segs.length-1].to : "D\u00E9part";
    segs.push({t:"walk", from:lastFrom, to:"Arriv\u00E9e", mins:walkToEnd, dist:bestEndD*1000, label:"Marche vers destination"});
  }

  return segs;
}

function setStart(lat, lng, name) {
  state.start = {lat: lat, lng: lng, name: name || (lat.toFixed(4)+", "+lng.toFixed(4))};
  if (startMk) map.removeLayer(startMk);
  startMk = L.marker([lat, lng], {
    icon: L.divIcon({className:"", iconSize:[14,14], iconAnchor:[7,7],
      html:'<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#58a6ff;border:2px solid #0d1117;box-shadow:0 0 6px rgba(88,166,255,0.5)"></span>'}),
    title: "D\u00E9part"
  }).addTo(map).bindPopup("<b>D\u00E9part</b><br>"+(name||"")).openPopup();
  map.setView([lat, lng], map.getZoom() < 13 ? 13 : map.getZoom());
  updateUI();
}

function setEnd(lat, lng, name) {
  state.end = {lat: lat, lng: lng, name: name || (lat.toFixed(4)+", "+lng.toFixed(4))};
  if (endMk) map.removeLayer(endMk);
  endMk = L.marker([lat, lng], {
    icon: L.divIcon({className:"", iconSize:[14,14], iconAnchor:[7,7],
      html:'<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#f85149;border:2px solid #0d1117;box-shadow:0 0 6px rgba(248,81,73,0.5)"></span>'}),
    title: "Arriv\u00E9e"
  }).addTo(map).bindPopup("<b>Arriv\u00E9e</b><br>"+(name||"")).openPopup();
  updateUI();
}

// -- Nominatim search ---------------------------------------------------
function geocode(query) {
  return fetch("https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(query)+
    "&countrycodes=tn&limit=3&format=json", {headers:{"Accept-Language":"fr,en","User-Agent":"bledi.tn/1.0"}})
    .then(function(r){return r.json();})
    .then(function(j){
      if (!j || !j.length) return null;
      var best = j[0];
      return {
        lat: parseFloat(best.lat),
        lng: parseFloat(best.lon),
        name: best.display_name.split(",")[0]
      };
    });
}

document.getElementById("btnSearch").onclick = doSearch;
document.getElementById("qStart").addEventListener("keydown", function(e){if(e.key==="Enter")doSearch();});
document.getElementById("qEnd").addEventListener("keydown", function(e){if(e.key==="Enter")doSearch();});

function doSearch() {
  var qs = document.getElementById("qStart").value.trim();
  var qe = document.getElementById("qEnd").value.trim();
  if (!qs && !qe) { toast("Entrez un lieu \u00E0 rechercher","err"); return; }

  var bt = document.getElementById("btnSearch");
  bt.disabled = true;
  bt.innerHTML = '<span class="loading"></span> Recherche...';

  Promise.all([
    qs ? geocode(qs) : Promise.resolve(null),
    qe ? geocode(qe) : Promise.resolve(null)
  ]).then(function(res){
    bt.disabled = false;
    bt.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Rechercher';

    if (res[0]) { setStart(res[0].lat, res[0].lng, res[0].name); toast("D\u00E9part: "+res[0].name); }
    else if (qs) toast("Introuvable: "+qs,"err");

    if (res[1]) { setEnd(res[1].lat, res[1].lng, res[1].name); toast("Arriv\u00E9e: "+res[1].name); }
    else if (qe) toast("Introuvable: "+qe,"err");
  }).catch(function(e){
    bt.disabled = false;
    bt.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Rechercher';
    toast("Erreur de recherche: "+e.message,"err");
  });
}

// -- Departure time ----------------------------------------------------
function parseTime(str) {
   str = str.trim().toLowerCase();
   if (!str) return null;
   // Parse "H", "H:MM", "HH:MM", "H h", "HH h MM", etc.
   var parts = str.split(/\s*[h:]\s*/i);
   var h = parseInt(parts[0], 10);
   if (isNaN(h) || h < 0 || h > 23) return null;
   var min = (parts.length > 1 && parts[1] !== "") ? parseInt(parts[1], 10) : 0;
   if (isNaN(min) || min < 0 || min > 59) min = 0;
   return h * 60 + min;
}

function nowMin() {
  var d = new Date();
  var m = d.getHours() * 60 + d.getMinutes();
  return Math.ceil(m / 5) * 5;  // round up to next 5 min
}

function setDepTime(min) {
  state.depMin = min;
  var h = Math.floor(min/60), m = min%60;
  document.getElementById("depTime").value = h+"h"+(m<10?"0":"")+m;
}

document.getElementById("depTime").addEventListener("change", function(){
  var min = parseTime(this.value);
  if (min === null) { toast("Heure invalide (ex: 08h30)","err"); this.value = ""; }
  else state.depMin = min;
});
document.getElementById("btnNow").onclick = function(){
  setDepTime(nowMin());
  toast("Heure de d\u00E9part: "+document.getElementById("depTime").value);
};

    function(p){
      setStart(p.coords.latitude, p.coords.longitude, "Ma position");
      map.setView([p.coords.latitude, p.coords.longitude], 14);
      toast("Position r\u00E9cup\u00E9r\u00E9e");
    },
    function(){ toast("Position inaccessible","err"); },
    {enableHighAccuracy:true, timeout:10000}
  );
};

// -- Swap ---------------------------------------------------------------
document.getElementById("btnSwap").onclick = function(){
  var tmp = state.start; state.start = state.end; state.end = tmp;
  var tmpM = startMk; startMk = endMk; endMk = tmpM;
  if (startMk) startMk.setIcon(L.divIcon({className:"",iconSize:[14,14],iconAnchor:[7,7],
    html:'<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#58a6ff;border:2px solid #0d1117;box-shadow:0 0 6px rgba(88,166,255,0.5)"></span>'}));
  if (endMk) endMk.setIcon(L.divIcon({className:"",iconSize:[14,14],iconAnchor:[7,7],
    html:'<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#f85149;border:2px solid #0d1117;box-shadow:0 0 6px rgba(248,81,73,0.5)"></span>'}));
  updateUI();
  toast("D\u00E9part et arriv\u00E9e \u00E9chang\u00E9s");
};

// -- Clear --------------------------------------------------------------
document.getElementById("btnClear").onclick = clearAll;

// -- Toggle stations ----------------------------------------------------
document.getElementById("chkStations").onchange = function(e){
  if (e.target.checked) map.addLayer(stationLayer);
  else map.removeLayer(stationLayer);
};

// -- Calculate ----------------------------------------------------------
document.getElementById("btnGo").onclick = function(){
  if (!state.start || !state.end) { toast("Choisissez un d\u00E9part et une arriv\u00E9e","err"); return; }

  var depMin = state.depMin;
  if (depMin === null) {
    depMin = nowMin();
    setDepTime(depMin);
  }

  var bt = document.getElementById("btnGo");
  bt.disabled = true;
  bt.innerHTML = '<span class="loading"></span> Calcul en cours...';

  // Small delay for UI update
  setTimeout(function(){
    var results = planRoutes(state.start.lat, state.start.lng, state.end.lat, state.end.lng, depMin);

    if (results.length === 0) {
      document.getElementById("result").innerHTML =
        '<div class="opt" style="color:#f85149;text-align:center;padding:24px 12px">'+
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 8px"><path d="M18 6 6 18M6 6l12 12"/></svg>'+
        'Aucun itin\u00E9raire trouv\u00E9<br>Les deux points sont trop loin des gares<br>ou il n\'y a pas de transport pour cette zone.</div>';
      bt.disabled = false;
      bt.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m21 21-4.3-4.3M12 8v8M8 12h8"/></svg> Calculer l'itin\u00E9raire';
      return;
    }

    lastResults = results;
    renderResults(results, depMin);
    drawBestRoute(results);

    bt.disabled = false;
    bt.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m21 21-4.3-4.3M12 8v8M8 12h8"/></svg> Recalculer';
  }, 50);
};

function renderResults(results, depMin) {
  var html = "";
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var timeStr = formatTime(r.totalMin);
    var modeLabel = r.mode === "walk" ? "Marche" : r.mode === "taxi" ? "Taxi" : "Transit";
    var transferStr = r.xfers > 0 ? " * " + r.xfers + " transf." : "";

    html += '<div class="opt'+(i===0?' active':'')+'" data-idx="'+i+'">'+
      '<div class="opt-header">'+
        '<span class="opt-time">'+timeStr+' min</span>'+
        '<span class="opt-meta"><span class="pill '+(r.mode==="walk"||r.mode==="taxi"?"walk":"ride")+'">'+modeLabel+'</span>'+transferStr+'</span>'+
      '</div>'+
      '<div class="opt-steps">';

    for (var j = 0; j < r.segs.length; j++) {
      var seg = r.segs[j];
      var timeStr2 = formatTime(seg.mins);
      var time = timeStr2;
      var distStr = seg.dist > 0 ? formatDist(seg.dist) : "";
      var extra = "";

      if (seg.type === "wait" && seg.depMin !== undefined) {
        var dh = Math.floor(seg.depMin/60), dm = seg.depMin%60;
        extra = " (d\u00E9part: " + dh + "h" + (dm<10?"0":"") + dm + ")";
      }
      if (seg.line) extra += " - " + seg.line;
      if (seg.from && seg.from !== seg.to && !seg.line) extra += " - " + seg.from + " => " + seg.to;

      var icon = "";
      var dot = "#0dcaf0";
      if (seg.type === "walk") icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10v6M6 14h12"/></svg>';
      else if (seg.type === "wait") { icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; dot = "#e9b949"; }
      else if (seg.type === "ride") icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>';
      else if (seg.type === "taxi") icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h6l4 4-4 4H6z"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/></svg>';
      else if (seg.type === "transfer") { icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><path d="M10 14L21 3"/></svg>'; dot = "#f59f00"; }
      else if (seg.line && seg.line.color) dot = seg.line.color;

      var inner = "";
      if (seg.type === "ride" && seg.line) {
        inner = ' ' + seg.label;
      } else if (seg.type === "transfer") {
        inner = '<b>' + seg.label + '</b>' +
          '<br><span style="color:#8b949e;font-size:11px">' + seg.mins + ' min de correspondance</span>';
      } else if (seg.type === "taxi") {
        time = Math.round(seg.mins) + ' min';
        inner = '<b> Taxi direct</b>  ' + time + '  ' + seg.fare.toFixed(3) + ' DT';
        inner += ' <span style="color:#0dcaf0">' + seg.km.toFixed(1) + ' km  prix indicatif (compteur)';
        inner += '<br><small style="color:#8b949e">' + seg.stops + ' stations</small>';
      } else if (seg.type === "walk") {
        inner = '<b>'+timeStr2+'</b> '+distStr+' - '+
          '<span style="color:#58a6ff">'+seg.label+'</span>'+
          (extra ? ' <span style="color:#8b949e">'+extra+'</span>' : "")+
          '<br><span style="color:#8b949e;font-size:11px">'+(seg.from||"")+' => '+(seg.to||"")+'</span>';
      } else {
        inner = '<b>'+timeStr2+'</b> '+distStr+' - '+
          '<span style="color:#58a6ff">'+seg.label+'</span>'+
          (extra ? ' <span style="color:#8b949e">'+extra+'</span>' : "")+
          '<br><span style="color:#8b949e;font-size:11px">'+(seg.from||"")+' => '+(seg.to||"")+'</span>';
      }
      html += '<div class="step">' +
        '<span class="dot" style="background:' + dot + '"></span>' +
        '<span class="txt">' + inner + '</span>' +
        '<span class="t">' + time + '</span></div>';
    }

    html += '</div></div>';
  }

  document.getElementById("result").innerHTML = html;

  // Click to select option
  var opts = document.querySelectorAll(".result .opt");
  opts.forEach(function(el){
    el.onclick = function(){
      var idx = +this.dataset.idx;
      selectOption(idx);
    };
  });
}

function selectOption(idx) {
  if (idx < 0 || idx >= lastResults.length) return;
  var r = lastResults[idx];

  // Clear previous route
  routeLayers.clearLayers();

  // Draw the route segments on the map
  var curLat = state.start.lat, curLng = state.start.lng;

  // Draw walk from start to first station
  if (r.startSt >= 0) {
    var s = ST[r.startSt];
    routeLayers.addLayer(L.polyline([[curLat,curLng],[s._lat,s._lon]], {
      color:"#8b949e", weight:2, dashArray:"6 6", opacity:0.7
    }));
    routeLayers.addLayer(L.circleMarker([s._lat,s._lon],{
      radius:5, color:"#8b949e", fillColor:"#8b949e", fillOpacity:0.5, weight:1
    }));
    curLat = s._lat; curLng = s._lon;
  }

  // Draw each segment
  for (var i = 0; i < r.segs.length; i++) {
    var seg = r.segs[i];
    if (seg.type === "walk") {
      var endLat, endLng;
      if (i === r.segs.length - 1 && r.endSt >= 0) {
        var e = ST[r.endSt];
        endLat = e._lat; endLng = e._lon;
      } else if (seg.to === "Arriv\u00E9e") {
        endLat = state.end.lat; endLng = state.end.lng;
      } else {
        // Find station by name
        for (var j = 0; j < ST.length; j++) {
          if (ST[j]._name === seg.to) { endLat = ST[j]._lat; endLng = ST[j]._lon; break; }
        }
      }
      if (endLat !== undefined) {
        routeLayers.addLayer(L.polyline([[curLat,curLng],[endLat,endLng]], {
          color:"#8b949e", weight:2, dashArray:"6 6", opacity:0.7
        }));
        curLat = endLat; curLng = endLng;
      }
    } else if (seg.type === "transfer") {
      // Draw dashed line from current position to next ride start
      var endLat, endLng;
      if (seg.to && seg.to !== "Arriv\u00E9e") {
        for (var ti = 0; ti < ST.length; ti++) {
          if (ST[ti]._name === seg.to) { endLat = ST[ti]._lat; endLng = ST[ti]._lon; break; }
        }
      }
      if (endLat !== undefined) {
        routeLayers.addLayer(L.polyline([[curLat,curLng],[endLat,endLng]], {
          color:"#f59f00", weight:2, dashArray:"4 4", opacity:0.7
        }));
        routeLayers.addLayer(L.circleMarker([endLat, endLng], {
          radius:4, color:"#0f1923", fillColor:"#f59f00",
          fillOpacity:0.9, weight:1, title: seg.label
        }));
        curLat = endLat; curLng = endLng;
      }
    } else if (seg.type === "ride") {
      const A = ST[seg.line.stops[seg.fromIdx]];
      const B = ST[seg.line.stops[seg.toIdx]];
      if (A && B) {
        routeLayers.addLayer(L.polyline([
          [A._lat, A._lon],
          [B._lat, B._lon]
        ], {
          color:modeColor(seg.mode),
          weight:4, opacity:0.9
        }));
        routeLayers.addLayer(L.circleMarker([A._lat, A._lon],{
          radius:3, color:"#0f1923", fillColor:modeColor(seg.mode),
          fillOpacity:0.8, weight:1, title:A._name
        }));
        routeLayers.addLayer(L.circleMarker([B._lat, B._lon],{
          radius:3, color:"#0f1923", fillColor:modeColor(seg.mode),
          fillOpacity:0.8, weight:1, title:B._name
        }));
        curLat = B._lat; curLng = B._lon;
      }
  }

  // Draw walk from last station to end
  if (r.endSt >= 0) {
    var e = ST[r.endSt];
    routeLayers.addLayer(L.polyline([[curLat,curLng],[e._lat,e._lon]], {
      color:"#8b949e", weight:2, dashArray:"6 6", opacity:0.7
    }));
    routeLayers.addLayer(L.circleMarker([e._lat,e._lon],{
      radius:5, color:"#f85149", fillColor:"#f85149", fillOpacity:0.5, weight:1
    }));
  }

  // Fit bounds
  var allBounds = [];
  if (startMk) allBounds.push(startMk.getLatLng());
  if (endMk) allBounds.push(endMk.getLatLng());
  routeLayers.getLayers().forEach(function(l){
    if (l.getLatLng) allBounds.push(l.getLatLng());
    if (l.getBounds) { l.getBounds().eachLayer(function(ll){if(ll.getLatLng)allBounds.push(ll.getLatLng());}); }
  });
  if (allBounds.length > 0) {
    try {
      var bounds = L.latLngBounds(allBounds);
      map.fitBounds(bounds, {padding:[40,40]});
    } catch(e){}
  }

  toast("Itin\u00E9raire "+(idx+1)+" s\u00E9lectionn\u00E9 - "+formatTime(r.totalMin)+" min");
}

function drawBestRoute(results) {
  // Pre-draw the best route lightly on map
  if (results.length > 0) {
    selectOption(0);
  }
}

// -- Toast --------------------------------------------------------------
var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg, isErr) {
  toastEl.textContent = msg;
  toastEl.className = "toast" + (isErr ? " err" : "") + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.className = "toast"; }, 3000);
}

// -- Init ---------------------------------------------------------------
updateUI();

// Keyboard: Escape to cancel pending
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && pending) {
    pending = null;
    document.getElementById("btnStart").style.background = "";
    document.getElementById("btnEnd").style.background = "";
    toast("Annul\u00E9");
  }
});

// Log
console.log("Bledi.tn charg\u00E9 - "+ST.length+" gares, "+LINES.length+" lignes, "+228+" horaires");

})();
</script>
