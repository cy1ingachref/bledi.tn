<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bledi.tn — Tunisia Transit</title>
    <meta
      name="description"
      content="Planifiez votre trajet avec les transports publics en Tunisie : bus, métro, train, RFR, louaj."
    />
    <meta name="theme-color" content="#0f0b1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf4e8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Resolve the theme BEFORE first paint so an explicit light choice never
         flashes the dark background. Kept tiny and inline on purpose: a bundled
         module would run after the first paint. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("bledi_theme");
          var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = p === "light" || p === "dark" ? p : dark ? "dark" : "light";
          document.documentElement.dataset.theme = r;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
