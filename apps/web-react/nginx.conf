# Rendered by the nginx image's envsubst step: only ${ACCOUNTS_URL},
# ${TRANSIT_URL} and ${ROUTING_URL} are substituted (see Dockerfile
# NGINX_ENVSUBST_FILTER). ROUTING_URL must be a scheme, host and port with no
# path, so proxy_pass forwards the request URI unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # CSP for the React app: MapLibre 6 loads its worker from a same-origin
    # /assets/*.mjs URL (module worker), so worker-src needs 'self' as well as
    # blob:. Maptoolkit / OSRM / Nominatim hosts are allowed on img/connect.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwritten, not appended: accounts rate-limits on the first entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/v1/auth/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/users/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/memories { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/media/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/favorites { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/friendships { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/location-shares { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/ { proxy_pass ${TRANSIT_URL}; }
    # Strip /routing: /routing/route -> ${ROUTING_URL}/route.
    location ^~ /routing/ { proxy_pass ${ROUTING_URL}/; }

    location = /index.html { expires -1; }

    # SPA fallback for the React client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
