apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-routing
  namespace: bledi
  labels: {app: transit-routing}
spec:
  replicas: 2
  selector: {matchLabels: {app: transit-routing}}
  template:
    metadata: {labels: {app: transit-routing}}
    spec:
      containers:
        - name: routing
          image: bledi-routing:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081, name: http}]
          env:
            - {name: BLEDI_DATA_DIR, value: /app/data}
            - {name: PORT, value: "8081"}
            - {name: RUST_LOG, value: info}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: transit-routing, namespace: bledi, labels: {app: transit-routing}}
spec:
  type: ClusterIP
  selector: {app: transit-routing}
  ports: [{name: http, port: 8081, targetPort: http}]
