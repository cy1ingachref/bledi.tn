apiVersion: apps/v1
kind: Deployment
metadata: {name: transit-api, namespace: bledi, labels: {app: transit-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: transit-api}}
  template:
    metadata: {labels: {app: transit-api}}
    spec:
      containers:
        - name: transit
          image: bledi-transit:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: BLEDI_DATA_DIR, value: /app/data}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: transit-api, namespace: bledi, labels: {app: transit-api}}
spec:
  type: ClusterIP
  selector: {app: transit-api}
  ports: [{name: http, port: 8000, targetPort: http}]
