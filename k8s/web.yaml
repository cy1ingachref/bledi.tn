apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: bledi, labels: {app: web}}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: bledi-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: TRANSIT_URL, value: "http://transit-api:8000"}
            - {name: ROUTING_URL, value: "http://transit-routing:8081"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: bledi, labels: {app: web}}
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: http}]
