name: Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists the PR's commits through the API.
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
        with:
          # gitleaks scans the PR's commit range, which a shallow clone lacks.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Blocks on ERROR severity only; the WARNING-level audit rules flag
      # every urllib call in the offline data scripts.
      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0
          semgrep scan --config p/security-audit --config p/owasp-top-ten
          --severity ERROR --error --metrics=off

      # Pinned to a commit: trivy-action tags were rewritten in a 2026 supply chain attack.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
