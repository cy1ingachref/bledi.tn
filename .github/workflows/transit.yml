name: Transit

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/transit/**'
      - 'data/**'
      - '.github/workflows/transit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/transit
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/transit/requirements-dev.lock.txt

      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: lint-imports
      - name: Run pytest with retry
        shell: /usr/bin/bash {0}
        run: |
          for attempt in 1 2 3; do
            if python -m pytest -q tests/ -x; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "All attempts failed"
          exit 1
