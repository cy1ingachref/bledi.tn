name: Transit

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/transit/**'
      - 'data/**'
      - '.github/workflows/transit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/transit
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/transit/requirements-dev.lock.txt

      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: lint-imports
      - run: python -m pytest -q
