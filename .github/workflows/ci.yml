name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Build, Test & Runtime Smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
      RUST_LOG: debug

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bledi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bledi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Format code
        working-directory: rust
        run: cargo fmt

      - name: Check formatting
        working-directory: rust
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Run tests
        working-directory: rust
        run: cargo test -- --nocapture

      # ── Runtime smoke test ──

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl

      - name: Install sqlx-cli
        working-directory: rust
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Create PostGIS extensions
        working-directory: rust
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
        run: |
          cd bledi-server && psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS cube; CREATE EXTENSION IF NOT EXISTS earthdistance;"

      - name: Run migrations
        working-directory: rust
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
        run: |
          cd bledi-server && sqlx migrate run

      - name: Start bledi-server
        working-directory: rust
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
        run: |
          cd bledi-server && ./../target/release/bledi-server &
          echo $! > /tmp/bledi-server.pid
          echo "Server PID: $(cat /tmp/bledi-server.pid)"

      - name: Wait for server
        run: |
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 1
          done

      - name: Smoke test - health
        run: |
          echo "=== GET /api/v1/health ==="
          curl -s http://localhost:3000/api/v1/health | python3 -m json.tool

      - name: Smoke test - stations (empty)
        run: |
          echo "=== GET /api/v1/stations ==="
          curl -s http://localhost:3000/api/v1/stations | python3 -m json.tool

      - name: Smoke test - lines (empty)
        run: |
          echo "=== GET /api/v1/lines ==="
          curl -s http://localhost:3000/api/v1/lines | python3 -m json.tool

      - name: Smoke test - register
        run: |
          echo "=== POST /api/v1/auth/register ==="
          curl -s -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456","display_name":"Smoke Test"}' \
            | python3 -m json.tool

      - name: Smoke test - login
        run: |
          echo "=== POST /api/v1/auth/login ==="
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}')
          echo "$RESPONSE" | python3 -m json.tool
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "Token: ${TOKEN:0:20}..."

      - name: Smoke test - get_me (authenticated)
        run: |
          echo "=== GET /api/v1/users/me ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s http://localhost:3000/api/v1/users/me \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -m json.tool

      - name: Smoke test - memories (authenticated)
        run: |
          echo "=== GET /api/v1/memories ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s http://localhost:3000/api/v1/memories \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -m json.tool

      - name: Smoke test - create memory
        run: |
          echo "=== POST /api/v1/memories ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s -X POST http://localhost:3000/api/v1/memories \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"lat":36.8,"lon":10.2,"title":"Test memory","description":"Smoke test","media_url":"https://example.com/img.jpg","media_type":"image","visibility":"public","unlock_radius_m":200}' \
            | python3 -m json.tool

      - name: Smoke test - nearby memories
        run: |
          echo "=== GET /api/v1/memories/nearby ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s "http://localhost:3000/api/v1/memories/nearby?lat=36.8&lon=10.2&radius_m=1000" \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -m json.tool

      - name: Smoke test - favorites
        run: |
          echo "=== POST /api/v1/favorites ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s -X POST http://localhost:3000/api/v1/favorites \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"kind":"station","ref_id":"test_station","label":"Test Station"}' \
            | python3 -m json.tool
          echo "=== GET /api/v1/favorites ==="
          curl -s http://localhost:3000/api/v1/favorites \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -m json.tool

      - name: Smoke test - location share
        run: |
          echo "=== POST /api/v1/location-shares ==="
          TOKEN=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -s -X POST http://localhost:3000/api/v1/location-shares \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"lat":36.8,"lon":10.2,"accuracy_m":10.0,"note":"Smoke test","is_active":true}' \
            | python3 -m json.tool

      - name: Smoke test - unauthenticated request fails
        run: |
          echo "=== GET /api/v1/memories without token (should 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/memories)
          echo "Status code: $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: Expected 401, got $STATUS"
            exit 1
          fi

      - name: Stop server
        run: |
          if [ -f /tmp/bledi-server.pid ]; then
            kill $(cat /tmp/bledi-server.pid) || true
            rm /tmp/bledi-server.pid
          fi

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
