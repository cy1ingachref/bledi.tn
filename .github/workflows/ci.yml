name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Build, Test & Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
      RUST_LOG: info

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install PostgreSQL + PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib postgis
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE DATABASE bledi;" || true
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -d bledi -c "CREATE EXTENSION IF NOT EXISTS cube; CREATE EXTENSION IF NOT EXISTS earthdistance;"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: rust
        run: cargo build --release

      - name: Run tests
        working-directory: rust
        run: cargo test -- --nocapture

      # ── Runtime smoke test ──

      - name: Start bledi-server
        working-directory: rust
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bledi
        run: |
          ./target/release/bledi-server &
          echo $! > /tmp/bledi-server.pid
          echo "Server PID: $(cat /tmp/bledi-server.pid)"

      - name: Wait for server
        run: |
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            if ! kill -0 $(cat /tmp/bledi-server.pid) 2>/dev/null; then
              echo "ERROR: Server process died"
              exit 1
            fi
            echo "Attempt $i: not ready yet..."
            sleep 1
          done

      - name: Smoke test - health
        run: |
          echo "=== GET /api/v1/health ==="
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:3000/api/v1/health)
          cat /tmp/health.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - stations (empty)
        run: |
          echo "=== GET /api/v1/stations ==="
          STATUS=$(curl -s -o /tmp/stations.json -w "%{http_code}" http://localhost:3000/api/v1/stations)
          cat /tmp/stations.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - lines (empty)
        run: |
          echo "=== GET /api/v1/lines ==="
          STATUS=$(curl -s -o /tmp/lines.json -w "%{http_code}" http://localhost:3000/api/v1/lines)
          cat /tmp/lines.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - register
        run: |
          echo "=== POST /api/v1/auth/register ==="
          STATUS=$(curl -s -o /tmp/register.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456","display_name":"Smoke Test"}')
          cat /tmp/register.json | python3 -m json.tool
          if [ "$STATUS" != "201" ]; then
            echo "FAIL: Expected 201, got $STATUS"
            cat /tmp/register.json
            exit 1
          fi

      - name: Login and export token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"test123456"}')
          echo "$RESPONSE" | python3 -m json.tool
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Token: ${TOKEN:0:20}..."

      - name: Smoke test - get_me (authenticated)
        run: |
          echo "=== GET /api/v1/users/me ==="
          STATUS=$(curl -s -o /tmp/me.json -w "%{http_code}" \
            http://localhost:3000/api/v1/users/me \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          cat /tmp/me.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - memories (authenticated)
        run: |
          echo "=== GET /api/v1/memories ==="
          STATUS=$(curl -s -o /tmp/memories.json -w "%{http_code}" \
            http://localhost:3000/api/v1/memories \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          cat /tmp/memories.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - create memory
        run: |
          echo "=== POST /api/v1/memories ==="
          STATUS=$(curl -s -o /tmp/create_mem.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/v1/memories \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"lat":36.8,"lon":10.2,"title":"Test memory","description":"Smoke test","media_url":"https://example.com/img.jpg","media_type":"image","visibility":"public","unlock_radius_m":200}')
          cat /tmp/create_mem.json | python3 -m json.tool
          if [ "$STATUS" != "201" ]; then
            echo "FAIL: Expected 201, got $STATUS"
            cat /tmp/create_mem.json
            exit 1
          fi

      - name: Smoke test - nearby memories
        run: |
          echo "=== GET /api/v1/memories/nearby ==="
          STATUS=$(curl -s -o /tmp/nearby_mem.json -w "%{http_code}" \
            "http://localhost:3000/api/v1/memories/nearby?lat=36.8&lon=10.2&radius_m=1000" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          cat /tmp/nearby_mem.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - favorites
        run: |
          echo "=== POST /api/v1/favorites ==="
          STATUS=$(curl -s -o /tmp/create_fav.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/v1/favorites \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"station","ref_id":"test_station","label":"Test Station"}')
          cat /tmp/create_fav.json | python3 -m json.tool
          if [ "$STATUS" != "201" ]; then
            echo "FAIL: Expected 201, got $STATUS"
            cat /tmp/create_fav.json
            exit 1
          fi
          echo "=== GET /api/v1/favorites ==="
          STATUS=$(curl -s -o /tmp/favs.json -w "%{http_code}" \
            http://localhost:3000/api/v1/favorites \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          cat /tmp/favs.json | python3 -m json.tool
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: Expected 200, got $STATUS"
            exit 1
          fi

      - name: Smoke test - location share
        run: |
          echo "=== POST /api/v1/location-shares ==="
          STATUS=$(curl -s -o /tmp/share.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/v1/location-shares \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"lat":36.8,"lon":10.2,"accuracy_m":10.0,"note":"Smoke test","is_active":true}')
          cat /tmp/share.json | python3 -m json.tool
          if [ "$STATUS" != "201" ]; then
            echo "FAIL: Expected 201, got $STATUS"
            cat /tmp/share.json
            exit 1
          fi

      - name: Smoke test - unauthenticated request fails
        run: |
          echo "=== GET /api/v1/memories without token (should 401) ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/memories)
          echo "Status code: $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: Expected 401, got $STATUS"
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/bledi-server.pid ]; then
            kill $(cat /tmp/bledi-server.pid) || true
            rm /tmp/bledi-server.pid
          fi

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
