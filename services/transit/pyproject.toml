[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bledi-transit"
version = "0.2.0"
description = "Tunisia public transport routing service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "starlette>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient.
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "bledi_transit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "bledi_transit.main",
    "bledi_transit.adapters",
    "bledi_transit.application",
    "bledi_transit.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework free"
type = "forbidden"
source_modules = ["bledi_transit.application", "bledi_transit.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "uvicorn", "numpy"]
