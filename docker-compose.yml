services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bledi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bledi}
    # No host port published: the database is only reachable from the compose
    # network. Publishing 5432 with a default password exposes Postgres to the
    # whole host (and to anything that can reach it) for no benefit in dev.
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bledi} -d ${POSTGRES_DB:-bledi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: services/accounts
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bledi}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bledi}
      # Required by the server; it refuses to start without a >=32 byte value.
      # Generate one with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npx vite --host 0.0.0.0
    depends_on:
      - backend

volumes:
  db_data:
