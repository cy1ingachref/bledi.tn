services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set ACCOUNTS_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/accounts/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # Over TCP: the entrypoint's init server listens on the socket only, so a
      # socket check passes before init-db.sh has created the accounts role.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  accounts:
    build: services/accounts
    environment:
      DATABASE_URL: postgres://accounts:${ACCOUNTS_DB_PASSWORD}@db:5432/accounts
      # At least 32 bytes: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The web gateway is the only way in, and it overwrites X-Forwarded-For.
      TRUST_PROXY_HEADERS: "1"
      RUST_LOG: info
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  transit:
    build:
      context: .
      dockerfile: services/transit/Dockerfile

  web:
    build: apps/web
    ports:
      - "8080:8080"
    depends_on:
      - accounts
      - transit

volumes:
  db_data:
