services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set ACCOUNTS_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./services/accounts/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # Over TCP: the entrypoint's init server listens on the socket only, so a
      # socket check passes before init-db.sh has created the accounts role.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  accounts:
    build: services/accounts
    environment:
      DATABASE_URL: postgres://accounts:${ACCOUNTS_DB_PASSWORD}@db:5432/accounts
      # At least 32 bytes: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The web gateway is the only way in, and it overwrites X-Forwarded-For.
      TRUST_PROXY_HEADERS: "1"
      # Uploaded photos live on a volume, so they survive a restart.
      MEDIA_ROOT: /app/media
      RUST_LOG: info
    volumes:
      - media_data:/app/media
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  transit:
    build:
      context: .
      dockerfile: services/transit/Dockerfile
    restart: on-failure
    environment:
      BLEDI_ENV: production
      NOMINATIM_CONTACT: ${NOMINATIM_CONTACT:?set NOMINATIM_CONTACT in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  transit-routing:
    build:
      context: .
      dockerfile: services/routing/Dockerfile
    restart: on-failure
    environment:
      BLEDI_DATA_DIR: /app/data
      PORT: "8081"
      RUST_LOG: info
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: apps/web-react
    ports:
      - "8080:8080"
    environment:
      TRANSIT_URL: http://transit:8000
      ACCOUNTS_URL: http://accounts:3000
      ROUTING_URL: http://transit-routing:8081
    depends_on:
      accounts:
        condition: service_healthy
      transit:
        condition: service_healthy
      transit-routing:
        condition: service_healthy

volumes:
  db_data:
  media_data:
