# Rendered by the nginx image's envsubst step: only ${ACCOUNTS_URL},
# ${TRANSIT_URL} and ${ROUTING_URL} are substituted (see Dockerfile
# NGINX_ENVSUBST_FILTER). ROUTING_URL must be a scheme, host and port with no
# path, so proxy_pass forwards the request URI unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # HSTS and the CSP sit at server level on purpose: a nested add_header
    # replaces the whole inherited set, so putting either inside a location
    # block would silently drop every header above it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src covers the API; img-src allows the media bytes and the map
    # tiles; 'unsafe-inline' for style is required by the SvelteKit shell.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwritten, not appended: accounts rate-limits on the first entry, so a
    # client-supplied value would let any caller pick its own bucket.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/v1/auth/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/users/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/memories { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/media/ { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/favorites { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/friendships { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/v1/location-shares { proxy_pass ${ACCOUNTS_URL}; }
    location ^~ /api/ { proxy_pass ${TRANSIT_URL}; }
    # Strip /routing: /routing/route -> ${ROUTING_URL}/route (trailing / on
    # proxy_pass replaces the matched location prefix; without it Rust 404s).
    location ^~ /routing/ { proxy_pass ${ROUTING_URL}/; }

    location ^~ /_app/immutable/ { expires 1y; }

    # The service worker and the shell must be revalidated, or a deploy never
    # reaches a browser that already has the old worker.
    location = /sw.js { expires -1; }
    location = /index.html { expires -1; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
